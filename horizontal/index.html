<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Display - Horizontal</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="../assets/adelaide-feed.js"></script>
<style>
:root {
  --bg: #000;
  --pad: 8px;
  --gap: 8px;
  --label-bg: rgba(0, 0, 0, 0.68);
  --label-border: rgba(255, 255, 255, 0.16);
  --label-text: #fff;
  --label-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
}
body { color: #fff; }

#wall {
  width: 100vw;
  height: 100vh;
  padding: var(--pad);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: var(--gap);
  background: #000;
}

.tile {
  position: relative;
  overflow: hidden;
  background: #050505;
  isolation: isolate;
}

.tile::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(to bottom, rgba(0,0,0,0.06) 0%, rgba(0,0,0,0) 18%, rgba(0,0,0,0.12) 100%);
  z-index: 2;
}

.tile.hero {
  grid-column: 1 / span 2;
  grid-row: 1 / span 2;
}

.tile.perth { grid-column: 3; grid-row: 1; }
.tile.adelaide { grid-column: 3; grid-row: 2; }
.tile.melbourne { grid-column: 1; grid-row: 3; }
.tile.brisbane { grid-column: 2; grid-row: 3; }
.tile.perisher { grid-column: 3; grid-row: 3; }

.label {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 4;
  display: inline-flex;
  align-items: center;
  max-width: calc(100% - 28px);
  padding: 10px 16px;
  border-radius: 999px;
  background: var(--label-bg);
  border: 1px solid var(--label-border);
  color: var(--label-text);
  font-weight: 800;
  font-size: clamp(14px, 0.95vw, 21px);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1;
  box-shadow: var(--label-shadow);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  pointer-events: none;
}

.tile.hero .label {
  top: 18px;
  left: 18px;
  padding: 12px 18px;
  font-size: clamp(16px, 1.05vw, 24px);
}

.frame,
.tile iframe,
.tile video,
.tile img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.hidden { display: none; }
.tile iframe { width: 100%; height: 100%; }

.tile.hero iframe,
.tile.melbourne iframe,
.tile.brisbane iframe,
.tile.perth iframe {
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

.tile.adelaide video,
.tile.adelaide img,
.tile.perth video,
.tile.perth img {
  object-fit: contain;
  object-position: center center;
  background: #000;
}

.tile img.feed-panorama {
  object-fit: cover;
  animation: panorama-pan 90s ease-in-out infinite alternate;
}

@keyframes panorama-pan {
  from { object-position: 0% 50%; }
  to { object-position: 100% 50%; }
}

.feed-offline {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 28px;
  background:
    radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.12), transparent 30%),
    linear-gradient(135deg, #0a0a0a, #171717 52%, #050505);
  color: rgba(255, 255, 255, 0.76);
  font-size: clamp(15px, 1vw, 20px);
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.35;
  text-align: center;
  text-transform: uppercase;
}
</style>
</head>
<body>
<div id="wall">
  <section class="tile hero sydney" data-type="youtube" data-city="Sydney">
    <div class="label">Sydney</div>
    <iframe class="frame" src="https://www.youtube.com/embed/5uZa3-RMFos?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" title="Sydney live feed"></iframe>
  </section>

  <section class="tile perth" data-type="ipcam" data-city="Perth">
    <div class="label">Perth</div>
    <video id="perth-video" class="frame" autoplay muted playsinline preload="auto" title="Perth live feed"></video>
    <img id="perth-fallback" class="frame hidden" src="https://s128.ipcamlive.com/streams/80i7dkjgqh0y9dgvh/snapshot.jpg" alt="Perth live snapshot" />
  </section>

  <section class="tile adelaide" data-type="hls" data-city="Adelaide">
    <div class="label">Adelaide</div>
    <video id="adelaide-video" class="frame" autoplay muted playsinline preload="auto" title="Adelaide live feed"></video>
    <img id="adelaide-fallback" class="frame hidden" src="https://s127.ipcamlive.com/streams/7fz6jisplh9tuxdq3/snapshot.jpg" alt="Adelaide live snapshot" />
  </section>

  <section class="tile melbourne" data-type="youtube" data-city="Melbourne">
    <div class="label">Melbourne</div>
    <iframe class="frame" src="https://www.youtube.com/embed/l_8DrACHpwY?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" title="Melbourne live feed"></iframe>
  </section>

  <section class="tile brisbane" data-type="youtube" data-city="Brisbane">
    <div class="label">Brisbane</div>
    <iframe
      id="brisbane-frame"
      class="frame"
      src="https://www.youtube.com/embed/I7OY3JC15EE?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0&enablejsapi=1"
      data-fallback-src="https://www.youtube.com/embed/I7OY3JC15EE?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0&enablejsapi=1"
      allow="autoplay; encrypted-media; picture-in-picture"
      referrerpolicy="strict-origin-when-cross-origin"
      title="Brisbane live feed"></iframe>
  </section>

  <section class="tile perisher" data-type="youtube" data-city="Perisher">
    <div class="label">Perisher</div>
    <iframe class="frame" src="https://www.youtube.com/embed/yr09mo1sbq0?autoplay=1&mute=1&controls=0&modestbranding=1&playsinline=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" title="Perisher live feed"></iframe>
  </section>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  function onYouTubeIframeAPIReady() {
    const frame = document.getElementById('brisbane-frame');
    if (!frame || !window.YT || !YT.Player) return;

    const fallbackSrc = frame.dataset.fallbackSrc;
    if (!fallbackSrc || frame.src === fallbackSrc) return;

    let usedFallback = false;
    let noPlayTimer = null;
    let bufferTimer = null;

    function clearTimers() {
      window.clearTimeout(noPlayTimer);
      window.clearTimeout(bufferTimer);
    }

    function switchToFallback(reason) {
      if (usedFallback) return;
      usedFallback = true;
      clearTimers();
      frame.dataset.fallbackReason = reason || 'unknown';
      frame.src = fallbackSrc;
    }

    function armNoPlayTimer() {
      window.clearTimeout(noPlayTimer);
      noPlayTimer = window.setTimeout(() => switchToFallback('no-playing-state'), 45000);
    }

    function armBufferTimer() {
      window.clearTimeout(bufferTimer);
      bufferTimer = window.setTimeout(() => switchToFallback('buffering-timeout'), 30000);
    }

    new YT.Player(frame, {
      events: {
        onReady: armNoPlayTimer,
        onStateChange(event) {
          if (event.data === YT.PlayerState.PLAYING) {
            clearTimers();
            return;
          }

          if (event.data === YT.PlayerState.BUFFERING) {
            armBufferTimer();
            return;
          }

          if ([YT.PlayerState.UNSTARTED, YT.PlayerState.CUED].includes(event.data)) armNoPlayTimer();
          if (event.data === YT.PlayerState.ENDED) switchToFallback('ended');
        },
        onError: () => switchToFallback('youtube-error')
      }
    });

  }
</script>

</script>
</body>
