name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'feeds/adelaide.json'
      - 'feeds/brisbane.json'
      - 'assets/adelaide-fallback.jpg'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://ocklefrost.github.io/studio-display/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment_1
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before Pages deploy retry
        if: ${{ steps.deployment_1.outcome == 'failure' }}
        run: sleep 20

      - id: deployment_2
        if: ${{ steps.deployment_1.outcome == 'failure' }}
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait before final Pages deploy retry
        if: ${{ steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' }}
        run: sleep 45

      - id: deployment_3
        if: ${{ steps.deployment_1.outcome == 'failure' && steps.deployment_2.outcome == 'failure' }}
        uses: actions/deploy-pages@v5

      - name: Report Pages deploy retry
        if: ${{ steps.deployment_1.outcome == 'failure' && (steps.deployment_2.outcome == 'success' || steps.deployment_3.outcome == 'success') }}
        run: |
          echo 'Pages deploy failed once, then recovered on retry.'
          echo '::warning title=GitHub Pages deploy recovered::Initial deploy attempt failed, but a retry succeeded.'
