name: Update Perth feed

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-perth-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current Perth IPCamLive stream
        run: |
          python3 - <<'PY'
          import json
          import os
          import socket
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          alias = 'skimoveable'
          endpoint = 'https://www.ipcamlive.com/ajax/getcamerastreamstate.php?'
          path = Path('feeds/perth.json')
          url = endpoint + urllib.parse.urlencode({'cameraalias': alias})

          def warn(stage, operation, impact, evidence, resolution):
              message = (
                  f'SUCCESS_WITH_WARNINGS: stage={stage}; operation={operation}; '
                  f'impact={impact}; evidence={evidence}; resolution={resolution}'
              )
              print(message)
              print(f'::warning title=Perth feed degraded::{message}')
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as summary:
                      summary.write('## SUCCESS_WITH_WARNINGS\n')
                      summary.write(f'- stage: {stage}\n')
                      summary.write(f'- operation: {operation}\n')
                      summary.write(f'- impact: {impact}\n')
                      summary.write(f'- evidence: {evidence}\n')
                      summary.write(f'- resolution: {resolution}\n')

          def fetch_text(fetch_url, referer=None):
              headers = {'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)'}
              if referer:
                  headers['Referer'] = referer
              req = urllib.request.Request(fetch_url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode('utf-8', errors='replace')

          def verify_hls(stream_url):
              if not stream_url:
                  raise RuntimeError('missing stream URL')
              text = fetch_text(stream_url, referer='https://www.ipcamlive.com/')
              if '#EXTM3U' not in text:
                  raise RuntimeError('HLS playlist response did not contain #EXTM3U')

          def write_offline_feed(reason):
              feed = {
                  'alias': alias,
                  'kind': 'image',
                  'status': 'backup',
                  'reason': f'{reason}; using Fremantle Ports Victoria Quay Roundshot backup',
                  'image_url': 'https://fremantleports.roundshot.com/cams/793',
                  'source': 'Fremantle Ports Victoria Quay harbourcam',
                  'source_url': 'https://fremantleports.roundshot.com/camera1/',
                  'refresh_seconds': 300,
                  'panorama': True,
              }

              path.parent.mkdir(parents=True, exist_ok=True)
              old = path.read_text(encoding='utf-8') if path.exists() else ''
              new = json.dumps(feed, indent=2, ensure_ascii=False) + '\n'
              if old == new:
                  print('NO_CHANGE', json.dumps(feed, ensure_ascii=False))
              else:
                  path.write_text(new, encoding='utf-8')
                  print('UPDATED', json.dumps(feed, ensure_ascii=False))

          def keep_existing_feed(reason):
              if not path.exists():
                  warn(
                      'Resolve current Perth IPCamLive stream',
                      'fetch alias endpoint',
                      'no existing Perth feed was available, so no feed file could be preserved',
                      reason,
                      'retry on the next scheduled workflow run'
                  )
                  sys.exit(0)

              existing = json.loads(path.read_text(encoding='utf-8'))
              if existing.get('kind') == 'hls':
                  try:
                      verify_hls(existing.get('stream_url'))
                      warn(
                          'Resolve current Perth IPCamLive stream',
                          'fetch alias endpoint',
                          'kept existing Perth HLS feed after validating the previous stream URL',
                          reason,
                          'retry IPCamLive alias lookup on the next scheduled workflow run'
                      )
                      print('NO_CHANGE', json.dumps(existing, ensure_ascii=False))
                      sys.exit(0)
                  except Exception as stale_exc:
                      warn(
                          'Resolve current Perth IPCamLive stream',
                          'fetch alias endpoint and validate previous HLS',
                          'previous Perth HLS feed appears stale, so Perth will show the Victoria Quay backup panorama',
                          f'{reason}; previous HLS error={stale_exc!r}',
                          'retry on the next scheduled workflow run'
                      )
                      write_offline_feed(f'Previous Perth HLS became unavailable; {reason}')
                      sys.exit(0)

              print('NO_CHANGE', json.dumps(existing, ensure_ascii=False))
              sys.exit(0)

          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)',
              'Referer': 'https://www.ipcamlive.com/'
          })

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read().decode('utf-8', errors='replace'))
          except (TimeoutError, socket.timeout, urllib.error.URLError) as exc:
              keep_existing_feed(repr(exc))
          except json.JSONDecodeError as exc:
              keep_existing_feed(f'invalid JSON from IPCamLive: {exc}')

          details = payload.get('details', {})
          stream_id = details.get('streamid')
          streamavailable = details.get('streamavailable')

          if not stream_id:
              reason = f'IPCamLive returned no streamid; streamavailable={streamavailable}'
              warn(
                  'Resolve current Perth IPCamLive stream',
                  'resolve alias stream id',
                  'Perth will show the Victoria Quay backup panorama instead of a stale frame',
                  reason,
                  'retry IPCamLive alias lookup on the next scheduled workflow run'
              )
              write_offline_feed(reason)
              sys.exit(0)

          address = details.get('address') or 'http://s128.ipcamlive.com/'
          host = urllib.parse.urlparse(address).netloc or 's128.ipcamlive.com'
          stream_url = f'https://{host}/streams/{stream_id}/stream.m3u8'
          snapshot_url = f'https://{host}/streams/{stream_id}/snapshot.jpg'
          verify_hls(stream_url)

          feed = {
              'alias': alias,
              'kind': 'hls',
              'streamid': stream_id,
              'stream_url': stream_url,
              'snapshot_url': snapshot_url
          }

          path.parent.mkdir(parents=True, exist_ok=True)
          old = path.read_text(encoding='utf-8') if path.exists() else ''
          new = json.dumps(feed, indent=2, ensure_ascii=False) + '\n'
          if old == new:
              print('NO_CHANGE', json.dumps(feed, ensure_ascii=False))
          else:
              path.write_text(new, encoding='utf-8')
              print('UPDATED', json.dumps(feed, ensure_ascii=False))
          PY

      - name: Commit Perth feed update
        run: |
          if git diff --quiet -- feeds/perth.json; then
            exit 0
          fi
          stream_id=$(python3 - <<'PY'
          import json
          feed = json.load(open('feeds/perth.json'))
          print(feed.get('streamid') or 'fallback')
          PY
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/perth.json
          git commit -m "Update Perth feed alias to ${stream_id}"
          git push
