name: Update Adelaide feed

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adelaide-feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fallback capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Resolve current IPCamLive stream
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import socket
          import subprocess
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          alias = 'bsyc1080'
          city_webcam_url = 'https://www.cityofadelaide.com.au/webcams/town-hall-south/'
          city_hls_url = 'https://stream.castr.com/6747e375d1a99d0e8db51bb0/live_67de07a0017d11f1be7e5b649faa3b0a/index.m3u8'
          fallback_image_path = Path('assets/adelaide-fallback.jpg')
          fallback_image_url = '/studio-display/assets/adelaide-fallback.jpg'
          offline_fallback_url = '/studio-display/assets/adelaide-offline.svg'
          endpoint = 'https://www.ipcamlive.com/ajax/getcamerastreamstate.php?'
          url = endpoint + urllib.parse.urlencode({'cameraalias': alias})
          path = Path('feeds/adelaide.json')

          def warn(stage, operation, impact, evidence, resolution):
              message = (
                  f'SUCCESS_WITH_WARNINGS: stage={stage}; operation={operation}; '
                  f'impact={impact}; evidence={evidence}; resolution={resolution}'
              )
              print(message)
              print(f'::warning title=Adelaide feed degraded::{message}')
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as summary:
                      summary.write('## SUCCESS_WITH_WARNINGS\n')
                      summary.write(f'- stage: {stage}\n')
                      summary.write(f'- operation: {operation}\n')
                      summary.write(f'- impact: {impact}\n')
                      summary.write(f'- evidence: {evidence}\n')
                      summary.write(f'- resolution: {resolution}\n')

          def keep_existing_feed(reason):
              if path.exists():
                  existing = json.loads(path.read_text(encoding='utf-8'))
                  if existing.get('kind') == 'image' and (
                      existing.get('image_url') == fallback_image_url
                      or existing.get('snapshot_url') == fallback_image_url
                  ):
                      try:
                          capture_city_fallback()
                          warn(
                              'Resolve current IPCamLive stream',
                              'fetch alias endpoint',
                              'IPCamLive was unreachable, but the active City of Adelaide fallback image was refreshed',
                              reason,
                              'kept fallback mode and will retry IPCamLive on the next scheduled workflow run'
                          )
                          print('REFRESHED_FALLBACK_IMAGE', json.dumps(existing, ensure_ascii=False))
                      except Exception as fallback_exc:
                          warn(
                              'Resolve current IPCamLive stream',
                              'fetch alias endpoint and refresh City fallback',
                              'kept existing Adelaide fallback image because both IPCamLive and the City fallback refresh failed',
                              f'{reason}; city fallback error={fallback_exc!r}',
                              'retry on the next scheduled workflow run'
                          )
                          print('NO_CHANGE', json.dumps(existing, ensure_ascii=False))
                      sys.exit(0)

                  warn(
                      'Resolve current IPCamLive stream',
                      'fetch alias endpoint',
                      'kept existing Adelaide feed so the display continues with the last published live/fallback source',
                      reason,
                      'retry on the next scheduled workflow run'
                  )
                  print('NO_CHANGE', json.dumps(existing, ensure_ascii=False))
                  sys.exit(0)

              warn(
                  'Resolve current IPCamLive stream',
                  'fetch alias endpoint',
                  'no existing Adelaide feed was available, so wrote the built-in offline fallback',
                  reason,
                  'retry on the next scheduled workflow run'
              )
              return {
                  'alias': alias,
                  'kind': 'image',
                  'streamid': None,
                  'streamavailable': None,
                  'status': 'alias_fetch_failed',
                  'image_url': offline_fallback_url,
                  'snapshot_url': offline_fallback_url,
                  'fallback_source': None
              }

          def fetch_text(fetch_url, referer=None):
              headers = {'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)'}
              if referer:
                  headers['Referer'] = referer
              req = urllib.request.Request(fetch_url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode('utf-8', errors='replace')

          def capture_city_fallback():
              fallback_image_path.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'ffmpeg',
                  '-hide_banner',
                  '-loglevel', 'warning',
                  '-y',
                  '-headers', 'Referer: https://player.castr.com/\\r\\nOrigin: https://player.castr.com\\r\\nUser-Agent: Mozilla/5.0\\r\\n',
                  '-i', city_hls_url,
                  '-vf', 'select=gte(n\\,2)',
                  '-frames:v', '1',
                  '-q:v', '3',
                  '-update', '1',
                  str(fallback_image_path)
              ], check=True)

              if not fallback_image_path.exists() or fallback_image_path.stat().st_size < 1000:
                  raise RuntimeError('City webcam fallback capture did not produce a usable image')

              return fallback_image_url

          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)',
              'Referer': 'https://www.ipcamlive.com/'
          })
          payload = None
          feed = None
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read().decode('utf-8', errors='replace'))
          except (TimeoutError, socket.timeout, urllib.error.URLError) as exc:
              feed = keep_existing_feed(repr(exc))
          except json.JSONDecodeError as exc:
              feed = keep_existing_feed(f'invalid JSON from IPCamLive: {exc}')

          if payload is not None:
              stream_id = payload.get('details', {}).get('streamid')
              if not stream_id:
                  print('NO_STREAM_ID', json.dumps(payload, ensure_ascii=False))
                  try:
                      image_url = capture_city_fallback()
                      fallback_status = 'upstream_unavailable_city_screenshot'
                  except Exception as exc:
                      print('CITY_FALLBACK_FAILED', repr(exc))
                      image_url = offline_fallback_url
                      fallback_status = 'upstream_unavailable'

                  feed = {
                      'alias': alias,
                      'kind': 'image',
                      'streamid': None,
                      'streamavailable': payload.get('details', {}).get('streamavailable'),
                      'status': fallback_status,
                      'image_url': image_url,
                      'snapshot_url': image_url,
                      'fallback_source': city_webcam_url if image_url == fallback_image_url else None
                  }
              else:
                  feed = {
                      'alias': alias,
                      'kind': 'hls',
                      'streamid': stream_id,
                      'stream_url': f'https://s127.ipcamlive.com/streams/{stream_id}/stream.m3u8',
                      'snapshot_url': f'https://s127.ipcamlive.com/streams/{stream_id}/snapshot.jpg'
                  }

          path.parent.mkdir(parents=True, exist_ok=True)
          old = path.read_text(encoding='utf-8') if path.exists() else ''
          new = json.dumps(feed, indent=2, ensure_ascii=False) + '\n'
          if old == new:
              print('NO_CHANGE', json.dumps(feed, ensure_ascii=False))
          else:
              path.write_text(new, encoding='utf-8')
              print('UPDATED', json.dumps(feed, ensure_ascii=False))
          PY

      - name: Commit feed update
        run: |
          if git diff --quiet -- feeds/adelaide.json assets/adelaide-fallback.jpg; then
            exit 0
          fi
          stream_id=$(python3 - <<'PY'
          import json
          feed = json.load(open('feeds/adelaide.json'))
          print(feed.get('streamid') or feed.get('status') or 'fallback')
          PY
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/adelaide.json assets/adelaide-fallback.jpg
          git commit -m "Update Adelaide feed alias to ${stream_id}"
          git push
