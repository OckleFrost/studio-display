name: Update Adelaide feed

on:
  schedule:
    - cron: '*/5 * * * *'
    - cron: '1-59/5 * * * *'
    - cron: '2-59/5 * * * *'
    - cron: '3-59/5 * * * *'
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-adelaide-feed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fallback capture tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Resolve current IPCamLive stream
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import socket
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          alias = 'bsyc1080'
          city_webcam_url = 'https://www.cityofadelaide.com.au/webcams/town-hall-south/'
          city_hls_url = 'https://stream.castr.com/6747e375d1a99d0e8db51bb0/live_67de07a0017d11f1be7e5b649faa3b0a/index.m3u8'
          fallback_image_path = Path('assets/adelaide-fallback.jpg')
          fallback_image_url = 'https://raw.githubusercontent.com/OckleFrost/studio-display/main/assets/adelaide-fallback.jpg'
          legacy_fallback_image_url = '/studio-display/assets/adelaide-fallback.jpg'
          offline_fallback_url = '/studio-display/assets/adelaide-offline.svg'
          hls_stability_checks = 2
          hls_stability_interval_seconds = 8
          endpoint = 'https://www.ipcamlive.com/ajax/getcamerastreamstate.php?'
          url = endpoint + urllib.parse.urlencode({'cameraalias': alias})
          path = Path('feeds/adelaide.json')

          def is_city_fallback_url(value):
              if not value:
                  return False
              return str(value).split('?', 1)[0] in {
                  fallback_image_url,
                  legacy_fallback_image_url
              }

          def warn(stage, operation, impact, evidence, resolution):
              message = (
                  f'SUCCESS_WITH_WARNINGS: stage={stage}; operation={operation}; '
                  f'impact={impact}; evidence={evidence}; resolution={resolution}'
              )
              print(message)
              print(f'::warning title=Adelaide feed degraded::{message}')
              summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
              if summary_path:
                  with open(summary_path, 'a', encoding='utf-8') as summary:
                      summary.write('## SUCCESS_WITH_WARNINGS\n')
                      summary.write(f'- stage: {stage}\n')
                      summary.write(f'- operation: {operation}\n')
                      summary.write(f'- impact: {impact}\n')
                      summary.write(f'- evidence: {evidence}\n')
                      summary.write(f'- resolution: {resolution}\n')

          def keep_existing_feed(reason):
              if path.exists():
                  existing = json.loads(path.read_text(encoding='utf-8'))
                  if existing.get('kind') == 'image' and (
                      is_city_fallback_url(existing.get('image_url'))
                      or is_city_fallback_url(existing.get('snapshot_url'))
                  ):
                      warn(
                          'Resolve current IPCamLive stream',
                          'fetch alias endpoint',
                          'IPCamLive was unreachable, so the active City of Adelaide fallback image will be refreshed',
                          reason,
                          'keep fallback mode and retry IPCamLive on the next scheduled workflow run'
                      )
                      return build_city_fallback_feed(
                          'alias_fetch_failed_city_screenshot',
                          existing.get('streamavailable')
                      )

                  if existing.get('kind') == 'hls':
                      try:
                          verify_hls_feed(existing.get('stream_url'), existing.get('snapshot_url'))
                          warn(
                              'Resolve current IPCamLive stream',
                              'fetch alias endpoint',
                              'kept existing Adelaide HLS feed after validating the previous stream URL',
                              reason,
                              'retry IPCamLive alias lookup on the next scheduled workflow run'
                          )
                          print('NO_CHANGE', json.dumps(existing, ensure_ascii=False))
                          sys.exit(0)
                      except Exception as stale_exc:
                          warn(
                              'Resolve current IPCamLive stream',
                              'fetch alias endpoint and validate previous HLS',
                              'previous Adelaide HLS feed was stale, so the City fallback image will be refreshed',
                              f'{reason}; previous HLS error={stale_exc!r}',
                              'publish refreshed City fallback and retry IPCamLive on the next scheduled workflow run'
                          )
                          return build_city_fallback_feed(
                              'alias_fetch_failed_previous_hls_stale',
                              None
                          )

                  warn(
                      'Resolve current IPCamLive stream',
                      'fetch alias endpoint',
                      'kept existing Adelaide feed so the display continues with the last published live/fallback source',
                      reason,
                      'retry on the next scheduled workflow run'
                  )
                  print('NO_CHANGE', json.dumps(existing, ensure_ascii=False))
                  sys.exit(0)

              warn(
                  'Resolve current IPCamLive stream',
                  'fetch alias endpoint',
                  'no existing Adelaide feed was available, so wrote the built-in offline fallback',
                  reason,
                  'retry on the next scheduled workflow run'
              )
              return {
                  'alias': alias,
                  'kind': 'image',
                  'streamid': None,
                  'streamavailable': None,
                  'status': 'alias_fetch_failed',
                  'image_url': offline_fallback_url,
                  'snapshot_url': offline_fallback_url,
                  'fallback_source': None
              }

          def build_city_fallback_feed(status, streamavailable):
              try:
                  image_url, captured_at = capture_city_fallback()
                  versioned_image_url = f'{image_url}?captured={captured_at}'
                  fallback_status = status
              except Exception as exc:
                  print('CITY_FALLBACK_FAILED', repr(exc))
                  image_url = offline_fallback_url
                  versioned_image_url = offline_fallback_url
                  captured_at = None
                  fallback_status = 'upstream_unavailable'

              return {
                  'alias': alias,
                  'kind': 'image',
                  'streamid': None,
                  'streamavailable': streamavailable,
                  'status': fallback_status,
                  'image_url': versioned_image_url,
                  'snapshot_url': versioned_image_url,
                  'fallback_source': city_webcam_url if image_url == fallback_image_url else None,
                  'captured_at': captured_at
              }

          def fetch_text(fetch_url, referer=None):
              headers = {'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)'}
              if referer:
                  headers['Referer'] = referer
              req = urllib.request.Request(fetch_url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as response:
                  return response.read().decode('utf-8', errors='replace')

          def verify_hls(stream_url):
              if not stream_url:
                  raise RuntimeError('missing stream URL')

              text = fetch_text(stream_url, referer='https://www.ipcamlive.com/')
              if '#EXTM3U' not in text:
                  raise RuntimeError('HLS playlist response did not contain #EXTM3U')
              return True

          def verify_url(fetch_url, referer=None):
              if not fetch_url:
                  raise RuntimeError('missing URL')

              headers = {'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)'}
              if referer:
                  headers['Referer'] = referer

              req = urllib.request.Request(fetch_url, headers=headers, method='GET')
              with urllib.request.urlopen(req, timeout=20) as response:
                  content_type = response.headers.get('Content-Type', '')
                  body = response.read(128)
                  if response.status >= 400:
                      raise RuntimeError(f'URL returned HTTP {response.status}')
                  if not body:
                      raise RuntimeError('URL returned an empty response')
                  if 'image' not in content_type:
                      raise RuntimeError(f'URL returned non-image content type {content_type!r}')
              return True

          def verify_hls_feed(stream_url, snapshot_url):
              for attempt in range(hls_stability_checks):
                  verify_hls(stream_url)
                  verify_url(snapshot_url, referer='https://www.ipcamlive.com/')
                  if attempt < hls_stability_checks - 1:
                      time.sleep(hls_stability_interval_seconds)
              return True

          def capture_city_fallback():
              captured_at = int(time.time())
              fallback_image_path.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'ffmpeg',
                  '-hide_banner',
                  '-loglevel', 'warning',
                  '-y',
                  '-headers', 'Referer: https://player.castr.com/\\r\\nOrigin: https://player.castr.com\\r\\nUser-Agent: Mozilla/5.0\\r\\n',
                  '-i', city_hls_url,
                  '-vf', 'select=gte(n\\,2)',
                  '-frames:v', '1',
                  '-q:v', '3',
                  '-update', '1',
                  str(fallback_image_path)
              ], check=True)

              if not fallback_image_path.exists() or fallback_image_path.stat().st_size < 1000:
                  raise RuntimeError('City webcam fallback capture did not produce a usable image')

              return fallback_image_url, captured_at

          req = urllib.request.Request(url, headers={
              'User-Agent': 'Mozilla/5.0 (OpenClaw studio-display GitHub Action)',
              'Referer': 'https://www.ipcamlive.com/'
          })
          payload = None
          feed = None
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.loads(response.read().decode('utf-8', errors='replace'))
          except (TimeoutError, socket.timeout, urllib.error.URLError) as exc:
              feed = keep_existing_feed(repr(exc))
          except json.JSONDecodeError as exc:
              feed = keep_existing_feed(f'invalid JSON from IPCamLive: {exc}')

          if payload is not None:
              stream_id = payload.get('details', {}).get('streamid')
              streamavailable = payload.get('details', {}).get('streamavailable')
              if not stream_id:
                  print('NO_STREAM_ID', json.dumps(payload, ensure_ascii=False))
                  feed = build_city_fallback_feed(
                      'upstream_unavailable_city_screenshot',
                      streamavailable
                  )
              else:
                  stream_url = f'https://s127.ipcamlive.com/streams/{stream_id}/stream.m3u8'
                  snapshot_url = f'https://s127.ipcamlive.com/streams/{stream_id}/snapshot.jpg'
                  try:
                      verify_hls_feed(stream_url, snapshot_url)
                  except Exception as exc:
                      warn(
                          'Resolve current IPCamLive stream',
                          'validate IPCamLive HLS playlist',
                          'IPCamLive reported a stream ID but the playlist was not usable, so the City fallback image was refreshed instead',
                          f'streamid={stream_id}; error={exc!r}',
                          'publish refreshed City fallback and retry IPCamLive on the next scheduled workflow run'
                      )
                      feed = build_city_fallback_feed(
                          'reported_stream_unusable_city_screenshot',
                          streamavailable
                      )
                  else:
                      feed = {
                          'alias': alias,
                          'kind': 'hls',
                          'streamid': stream_id,
                          'stream_url': stream_url,
                          'snapshot_url': snapshot_url
                      }

          path.parent.mkdir(parents=True, exist_ok=True)
          old = path.read_text(encoding='utf-8') if path.exists() else ''
          new = json.dumps(feed, indent=2, ensure_ascii=False) + '\n'
          if old == new:
              print('NO_CHANGE', json.dumps(feed, ensure_ascii=False))
          else:
              path.write_text(new, encoding='utf-8')
              print('UPDATED', json.dumps(feed, ensure_ascii=False))
          PY

      - name: Commit feed update
        run: |
          if git diff --quiet -- feeds/adelaide.json assets/adelaide-fallback.jpg; then
            exit 0
          fi
          stream_id=$(python3 - <<'PY'
          import json
          feed = json.load(open('feeds/adelaide.json'))
          print(feed.get('streamid') or feed.get('status') or 'fallback')
          PY
          )
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add feeds/adelaide.json assets/adelaide-fallback.jpg
          git commit -m "Update Adelaide feed alias to ${stream_id}"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing onto the latest main before retrying."
            git fetch origin main
            git rebase origin/main
          done

          echo "::error title=Adelaide feed push failed::Could not push feed update after rebasing onto latest main."
          exit 1
