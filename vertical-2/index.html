<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Studio Display - Vertical 2</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="../assets/adelaide-feed.js?v=20260706-adelaide-fast-restore"></script>
<style>
:root {
  --bg: #000;
  --pad: 8px;
  --gap: 8px;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: var(--bg);
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
  background: var(--bg);
  overflow: hidden;
}

#stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vh;
  height: 100vw;
  padding: var(--pad);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1.18fr 1.18fr 1.18fr 0.9fr;
  gap: var(--gap);
  background: var(--bg);
  transform-origin: top left;
  transform: rotate(-90deg) translateX(-100%);
}

.stream {
  position: relative;
  overflow: hidden;
  background: #000;
}

.stream.sydney { grid-column: 1 / span 2; grid-row: 1; }
.stream.melbourne { grid-column: 1 / span 2; grid-row: 2; }
.stream.brisbane { grid-column: 1 / span 2; grid-row: 3; }
.stream.adelaide { grid-column: 1; grid-row: 4; }
.stream.perth { grid-column: 2; grid-row: 4; }

.label {
  position: absolute;
  top: 18px;
  left: 14px;
  z-index: 10;
  font-weight: 700;
  font-size: clamp(14px, 1.55vw, 24px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: white;
  background: rgba(0, 0, 0, 0.62);
  padding: 10px 16px;
  border-radius: 999px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}

.stream.sydney .label,
.stream.melbourne .label,
.stream.brisbane .label {
  left: 98px;
  top: 8px;
}

.stream.adelaide .label,
.stream.perth .label {
  top: 47px;
  left: 4px;
}

.stream iframe,
.stream video,
.stream img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.stream video,
.stream img {
  object-fit: contain;
  object-position: center center;
  background: #000;
}

.stream img.feed-panorama {
  object-fit: cover;
  animation: panorama-pan 90s ease-in-out infinite alternate;
}

@keyframes panorama-pan {
  from { object-position: 0% 50%; }
  to { object-position: 100% 50%; }
}

.feed-offline {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 28px;
  background:
    radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.12), transparent 30%),
    linear-gradient(135deg, #0a0a0a, #171717 52%, #050505);
  color: rgba(255, 255, 255, 0.76);
  font-size: clamp(15px, 1.2vw, 22px);
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.35;
  text-align: center;
  text-transform: uppercase;
}

.hidden { display: none; }
</style>
</head>
<body>
<div id="container">
  <div id="stage">

    <div class="stream sydney">
      <div class="label">Sydney</div>
      <iframe src="https://www.youtube.com/embed/5uZa3-RMFos?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream melbourne">
      <div class="label">Melbourne</div>
      <iframe src="https://www.youtube.com/embed/l_8DrACHpwY?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream brisbane">
      <div class="label">Brisbane</div>
      <iframe
        id="brisbane-frame"
        src="https://www.youtube.com/embed/I7OY3JC15EE?autoplay=1&mute=1&controls=0&modestbranding=1&enablejsapi=1"
        data-fallback-src="https://www.youtube.com/embed/I7OY3JC15EE?autoplay=1&mute=1&controls=0&modestbranding=1&enablejsapi=1"
        allow="autoplay"
        title="Brisbane live feed"></iframe>

    <div class="stream adelaide">
      <div class="label">Adelaide</div>
      <video id="adelaide-video" autoplay muted playsinline preload="auto" title="Adelaide live feed"></video>
      <img id="adelaide-fallback" class="hidden" src="https://s127.ipcamlive.com/streams/7fz6jisplh9tuxdq3/snapshot.jpg" alt="Adelaide live snapshot" />
    </div>

    <div class="stream perth">
      <div class="label">Perth</div>
      <video id="perth-video" autoplay muted playsinline preload="auto" title="Perth live feed"></video>
      <img id="perth-fallback" class="hidden" src="https://s128.ipcamlive.com/streams/80i7dkjgqh0y9dgvh/snapshot.jpg" alt="Perth live snapshot" />
    </div>

  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
  function onYouTubeIframeAPIReady() {
    const frame = document.getElementById('brisbane-frame');
    if (!frame || !window.YT || !YT.Player) return;

    const fallbackSrc = frame.dataset.fallbackSrc;
    if (!fallbackSrc || frame.src === fallbackSrc) return;

    let usedFallback = false;
    let noPlayTimer = null;
    let bufferTimer = null;

    function clearTimers() {
      window.clearTimeout(noPlayTimer);
      window.clearTimeout(bufferTimer);
    }

    function switchToFallback(reason) {
      if (usedFallback) return;
      usedFallback = true;
      clearTimers();
      frame.dataset.fallbackReason = reason || 'unknown';
      frame.src = fallbackSrc;
    }

    function armNoPlayTimer() {
      window.clearTimeout(noPlayTimer);
      noPlayTimer = window.setTimeout(() => switchToFallback('no-playing-state'), 45000);
    }

    function armBufferTimer() {
      window.clearTimeout(bufferTimer);
      bufferTimer = window.setTimeout(() => switchToFallback('buffering-timeout'), 30000);
    }

    new YT.Player(frame, {
      events: {
        onReady: armNoPlayTimer,
        onStateChange(event) {
          if (event.data === YT.PlayerState.PLAYING) {
            clearTimers();
            return;
          }

          if (event.data === YT.PlayerState.BUFFERING) {
            armBufferTimer();
            return;
          }

          if ([YT.PlayerState.UNSTARTED, YT.PlayerState.CUED].includes(event.data)) armNoPlayTimer();
          if (event.data === YT.PlayerState.ENDED) switchToFallback('ended');
        },
        onError: () => switchToFallback('youtube-error')
      }
    });

  }
</script>

</script>
