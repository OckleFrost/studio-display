<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Studio Display - Vertical 2</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root {
  --bg: #000;
  --pad: 8px;
  --gap: 8px;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: var(--bg);
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
  background: var(--bg);
  overflow: hidden;
}

#stage {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vh;
  height: 100vw;
  padding: var(--pad);
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: 1.18fr 1.18fr 1.18fr 0.9fr;
  gap: var(--gap);
  background: var(--bg);
  transform-origin: top left;
  transform: rotate(-90deg) translateX(-100%);
}

.stream {
  position: relative;
  overflow: hidden;
  background: #000;
}

.stream.sydney { grid-column: 1 / span 2; grid-row: 1; }
.stream.melbourne { grid-column: 1 / span 2; grid-row: 2; }
.stream.brisbane { grid-column: 1 / span 2; grid-row: 3; }
.stream.adelaide { grid-column: 1; grid-row: 4; }
.stream.perth { grid-column: 2; grid-row: 4; }

.label {
  position: absolute;
  top: 18px;
  left: 14px;
  z-index: 10;
  font-weight: 700;
  font-size: clamp(14px, 1.55vw, 24px);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: white;
  background: rgba(0, 0, 0, 0.62);
  padding: 10px 16px;
  border-radius: 999px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}

.stream iframe,
.stream video,
.stream img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.stream video,
.stream img {
  object-fit: contain;
  object-position: center center;
  background: #000;
}

.hidden { display: none; }
</style>
</head>
<body>
<div id="container">
  <div id="stage">

    <div class="stream sydney">
      <div class="label">Sydney</div>
      <iframe src="https://www.youtube.com/embed/5uZa3-RMFos?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream melbourne">
      <div class="label">Melbourne</div>
      <iframe src="https://www.youtube.com/embed/l_8DrACHpwY?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream brisbane">
      <div class="label">Brisbane</div>
      <iframe src="https://www.youtube.com/embed/xVTqTwPLhOU?si=0kVt1WaG5LSfaEXE&autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream adelaide">
      <div class="label">Adelaide</div>
      <video id="adelaide-video" autoplay muted playsinline preload="auto" title="Adelaide live feed"></video>
      <img id="adelaide-fallback" class="hidden" src="https://s127.ipcamlive.com/streams/7fkj6cd9nsrrtozcf/snapshot.jpg" alt="Adelaide live snapshot" />
    </div>

    <div class="stream perth">
      <div class="label">Perth</div>
      <iframe src="https://www.youtube.com/embed/uakxJIafWcw?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

  </div>
</div>

<script>
const adelaideStreamUrl = 'https://s127.ipcamlive.com/streams/7fkj6cd9nsrrtozcf/stream.m3u8';
const adelaideSnapshotUrl = 'https://s127.ipcamlive.com/streams/7fkj6cd9nsrrtozcf/snapshot.jpg';
const adelaideVideo = document.getElementById('adelaide-video');
const adelaideFallback = document.getElementById('adelaide-fallback');
let adelaideFallbackTimerStarted = false;

function showAdelaideFallback() {
  if (!adelaideFallback || !adelaideVideo) return;
  adelaideFallback.src = `${adelaideSnapshotUrl}?t=${Date.now()}`;
  adelaideFallback.classList.remove('hidden');
  adelaideVideo.classList.add('hidden');
}

function startAdelaideFallbackRefresh() {
  showAdelaideFallback();
  if (adelaideFallbackTimerStarted) return;
  adelaideFallbackTimerStarted = true;
  window.setInterval(() => {
    adelaideFallback.src = `${adelaideSnapshotUrl}?t=${Date.now()}`;
  }, 30000);
}

if (adelaideVideo) {
  adelaideVideo.muted = true;
  adelaideVideo.playsInline = true;

  if (adelaideVideo.canPlayType('application/vnd.apple.mpegurl')) {
    adelaideVideo.src = adelaideStreamUrl;
    adelaideVideo.play().catch(startAdelaideFallbackRefresh);
  } else if (window.Hls && Hls.isSupported()) {
    const hls = new Hls({ maxLiveSyncPlaybackRate: 1.5, liveDurationInfinity: true, enableWorker: true });
    hls.loadSource(adelaideStreamUrl);
    hls.attachMedia(adelaideVideo);
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      adelaideVideo.play().catch(startAdelaideFallbackRefresh);
    });
    hls.on(Hls.Events.ERROR, (_, data) => {
      if (data?.fatal) startAdelaideFallbackRefresh();
    });
  } else {
    startAdelaideFallbackRefresh();
  }

  adelaideVideo.addEventListener('error', startAdelaideFallbackRefresh);
}
</script>
</body>
</html>
