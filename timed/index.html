<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio Display - Timed</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <style>
    :root {
      --bg: #000;
      --overlay-bg: rgba(0, 0, 0, 0.62);
      --overlay-border: rgba(255, 255, 255, 0.16);
      --overlay-text: #fff;
      --shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      --transition-ms: 900ms;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      color: var(--overlay-text);
    }

    body { position: relative; }

    .layout {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--transition-ms) ease, visibility var(--transition-ms) ease;
      background: #000;
    }

    .layout.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .status {
      position: absolute;
      right: 14px;
      bottom: 14px;
      z-index: 20;
      display: inline-flex;
      flex-direction: column;
      gap: 4px;
      max-width: min(42vw, 480px);
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--overlay-bg);
      border: 1px solid var(--overlay-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      user-select: none;
    }

    .status strong {
      font-size: clamp(12px, 1vw, 14px);
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .status span {
      font-size: clamp(11px, 0.92vw, 13px);
      line-height: 1.35;
      opacity: 0.88;
    }

    .status.hidden { display: none; }
  </style>
</head>
<body>
  <iframe id="layout-onair" class="layout" data-src="../horizontal/" title="Studio Display on air layout" loading="eager"></iframe>
  <iframe id="layout-offair" class="layout" data-src="../vertical-2/" title="Studio Display off air layout" loading="lazy"></iframe>

  <div id="status" class="status">
    <strong id="status-mode">Loading…</strong>
    <span id="status-detail">Checking schedule</span>
  </div>

  <script>
    const DEFAULT_CONFIG = {
      timeZone: 'Australia/Sydney',
      switchCheckMs: 15000,
      configPollMs: 30000,
      showStatusOverlay: false,
      scheduleUrl: '../feeds/timed-schedule.json',
      schedules: [
        { days: [1, 2, 3, 4, 5], start: '07:30', end: '13:01', mode: 'onAir' },
        { days: [6], start: '00:00', end: '23:59', mode: 'onAir' },
        { days: [0], start: '00:00', end: '23:59', mode: 'onAir' }
      ],
      layouts: {
        onAir: {
          label: 'On air',
          detail: 'Horizontal wall',
          elementId: 'layout-onair'
        },
        offAir: {
          label: 'Off air',
          detail: 'Vertical 2 wall',
          elementId: 'layout-offair'
        }
      }
    };

    let runtimeConfig = structuredClone(DEFAULT_CONFIG);
    let lastAppliedScheduleHash = '';

    const dayMap = {
      Sun: 0,
      Mon: 1,
      Tue: 2,
      Wed: 3,
      Thu: 4,
      Fri: 5,
      Sat: 6
    };

    const activeEls = {
      onAir: document.getElementById(DEFAULT_CONFIG.layouts.onAir.elementId),
      offAir: document.getElementById(DEFAULT_CONFIG.layouts.offAir.elementId)
    };

    const BUILD_VERSION = '20260702-adelaide-refresh-watchdog';
    const pageVersion = new URLSearchParams(window.location.search).get('v') || BUILD_VERSION;

    function buildLayoutUrl(frame) {
      const url = new URL(frame.dataset.src, window.location.href);
      if (pageVersion) url.searchParams.set('v', pageVersion);
      return url.toString();
    }

    function mountLayout(frame) {
      if (!frame || frame.src) return;
      frame.src = buildLayoutUrl(frame);
    }

    function unmountLayout(frame) {
      if (!frame || !frame.src) return;
      frame.removeAttribute('src');
    }

    const statusEl = document.getElementById('status');
    const statusModeEl = document.getElementById('status-mode');
    const statusDetailEl = document.getElementById('status-detail');

    function mergeConfig(base, incoming) {
      if (!incoming || typeof incoming !== 'object') return structuredClone(base);
      return {
        ...base,
        ...incoming,
        layouts: {
          ...base.layouts,
          ...(incoming.layouts || {})
        },
        schedules: Array.isArray(incoming.schedules) ? incoming.schedules : base.schedules
      };
    }

    function getScheduleHash(config) {
      return JSON.stringify({
        timeZone: config.timeZone,
        showStatusOverlay: config.showStatusOverlay,
        schedules: config.schedules,
        layouts: config.layouts
      });
    }

    function getSydneyParts() {
      const formatter = new Intl.DateTimeFormat('en-AU', {
        timeZone: runtimeConfig.timeZone,
        weekday: 'short',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      });

      const parts = formatter.formatToParts(new Date());
      const values = Object.fromEntries(parts.filter(part => part.type !== 'literal').map(part => [part.type, part.value]));
      return {
        day: dayMap[values.weekday],
        time: `${values.hour}:${values.minute}`
      };
    }

    function inWindow(now, start, end) {
      if (start === end) return true;
      if (start < end) return now >= start && now < end;
      return now >= start || now < end;
    }

    function pickMode() {
      const { day, time } = getSydneyParts();
      const match = runtimeConfig.schedules.find(entry => entry.days.includes(day) && inWindow(time, entry.start, entry.end));
      return match?.mode || 'offAir';
    }

    function setActiveMode(mode) {
      Object.entries(activeEls).forEach(([key, el]) => {
        if (!el) return;
        const isActive = key === mode;
        el.classList.toggle('active', isActive);
        if (isActive) {
          mountLayout(el);
        } else {
          unmountLayout(el);
        }
      });

      const layout = runtimeConfig.layouts[mode];
      if (!runtimeConfig.showStatusOverlay) {
        statusEl.classList.add('hidden');
        return;
      }

      const { time } = getSydneyParts();
      statusModeEl.textContent = layout.label;
      const windowText = runtimeConfig.schedules.map(entry => `${entry.mode === 'onAir' ? 'H' : 'V'} ${entry.start}-${entry.end}`).join(' | ');
      statusDetailEl.textContent = `${layout.detail}, Sydney time ${time}, schedule ${windowText}`;
      statusEl.classList.remove('hidden');
    }

    function refreshMode() {
      setActiveMode(pickMode());
    }

    function applyConfig(nextConfig) {
      runtimeConfig = mergeConfig(DEFAULT_CONFIG, nextConfig);
      const scheduleHash = getScheduleHash(runtimeConfig);
      if (scheduleHash !== lastAppliedScheduleHash) {
        lastAppliedScheduleHash = scheduleHash;
      }
      refreshMode();
    }

    async function loadRemoteConfig() {
      const url = new URL(runtimeConfig.scheduleUrl || DEFAULT_CONFIG.scheduleUrl, window.location.href);
      url.searchParams.set('_', String(Date.now()));

      const response = await fetch(url.toString(), {
        cache: 'no-store',
        headers: {
          'Cache-Control': 'no-cache'
        }
      });

      if (!response.ok) {
        throw new Error(`Schedule fetch failed (${response.status})`);
      }

      const remoteConfig = await response.json();
      applyConfig(remoteConfig);
    }

    function startPolling() {
      window.setInterval(refreshMode, runtimeConfig.switchCheckMs || DEFAULT_CONFIG.switchCheckMs);
      window.setInterval(() => {
        loadRemoteConfig().catch(() => {
          // Keep the current schedule if the remote file is briefly unavailable.
        });
      }, runtimeConfig.configPollMs || DEFAULT_CONFIG.configPollMs);
    }

    applyConfig(DEFAULT_CONFIG);
    loadRemoteConfig().catch(() => {
      // Fall back to the baked-in default schedule on first load.
    }).finally(() => {
      startPolling();
    });
  </script>
</body>
</html>
