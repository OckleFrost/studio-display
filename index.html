<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Studio Display</title>
<script src="assets/brisbane-feed.js?v=20260706-brisbane-feed-watchdog"></script>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: black;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
  background: black;
  overflow: hidden;
}

/* Rotated Stage */
#stage {
  position: absolute;
  top: 0;
  left: 0;

  width: 100vh;
  height: 100vw;

  display: flex;
  flex-direction: column;
  background: black;

  transform-origin: top left;
  transform: rotate(-90deg) translateX(-100%);
}

.stream {
  position: relative;
  flex: 1;
  overflow: hidden;
}

/* STREAM LABEL */
.label {
  position: absolute;
  top: 54px;
  left: 2px;
  z-index: 10;

  font-weight: 700;
  font-size: clamp(20px, 2.5vw, 36px);
  letter-spacing: 3px;
  text-transform: uppercase;

  color: white;
  background: rgba(0, 0, 0, 0.6);
  padding: 12px 24px;
  border-radius: 6px;

  backdrop-filter: blur(6px);
  pointer-events: none;
}

.stream iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}

.feed-offline {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  padding: 28px;
  background:
    radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.12), transparent 30%),
    linear-gradient(135deg, #0a0a0a, #171717 52%, #050505);
  color: rgba(255, 255, 255, 0.76);
  font-size: clamp(18px, 2vw, 30px);
  font-weight: 700;
  letter-spacing: 0.08em;
  line-height: 1.35;
  text-align: center;
  text-transform: uppercase;
}
</style>
</head>

<body>

<div id="container">
  <div id="stage">

    <div class="stream">
      <div class="label">Sydney</div>
      <iframe src="https://www.youtube.com/embed/5uZa3-RMFos?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream">
      <div class="label">Melbourne</div>
      <iframe src="https://www.youtube.com/embed/l_8DrACHpwY?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream">
      <div class="label">Brisbane</div>
      <iframe
        id="brisbane-frame"
        src="https://www.youtube.com/embed/sCPKGMfHGQA?autoplay=1&mute=1&controls=0&modestbranding=1&enablejsapi=1"
        data-primary-video-id="sCPKGMfHGQA"
        data-fallback-video-id="I7OY3JC15EE"
        allow="autoplay"
        title="Brisbane live feed"></iframe>
    </div>

  </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
initBrisbaneFeed({
  frameId: 'brisbane-frame',
  initialVideoId: 'sCPKGMfHGQA',
  fallbackVideoId: 'I7OY3JC15EE',
  refreshMs: 300000
});
</script>
</body>
</html>
