<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Smooth Studio Display</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background: black;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

#container {
  width: 100%;
  height: 100%;
  position: relative;
  background: black;
  overflow: hidden;
}

/* Rotated Stage */
#stage {
  position: absolute;
  top: 0;
  left: 0;

  width: 100vh;
  height: 100vw;

  display: flex;
  flex-direction: column;
  background: black;

  transform-origin: top left;
  transform: rotate(-90deg) translateX(-100%);
}

.stream {
  position: relative;
  flex: 1;
  overflow: hidden;
}

/* STREAM LABEL */
.label {
  position: absolute;
  top: 54px;
  left: 2px;
  z-index: 10;

  font-weight: 700;
  font-size: clamp(20px, 2.5vw, 36px);
  letter-spacing: 3px;
  text-transform: uppercase;

  color: white;
  background: rgba(0, 0, 0, 0.6);
  padding: 12px 24px;
  border-radius: 6px;

  backdrop-filter: blur(6px);
  pointer-events: none;
}

.stream iframe {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
}
</style>
</head>

<body>

<div id="container">
  <div id="stage">

    <div class="stream">
      <div class="label">Melbourne</div>
      <iframe src="https://www.youtube.com/embed/l_8DrACHpwY?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream">
      <div class="label">Sydney</div>
      <iframe src="https://www.youtube.com/embed/5uZa3-RMFos?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

    <div class="stream">
      <div class="label">Brisbane</div>
      <iframe src="https://www.youtube.com/embed/7xTmCQf4NIo?autoplay=1&mute=1&controls=0&modestbranding=1" allow="autoplay"></iframe>
    </div>

  </div>
</div>

</body>
</html>
